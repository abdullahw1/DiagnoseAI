apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diagnoseai-ingress
  namespace: diagnoseai
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"  # Allow large file uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # If using cert-manager
spec:
  tls:
  - hosts:
    - diagnoseai.yourdomain.com  # Replace with your domain
    secretName: diagnoseai-tls
  rules:
  - host: diagnoseai.yourdomain.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: diagnoseai-service
            port:
              number: 80