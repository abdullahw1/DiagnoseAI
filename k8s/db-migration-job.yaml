apiVersion: batch/v1
kind: Job
metadata:
  name: diagnoseai-db-migration
  namespace: diagnoseai
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: db-migration
        image: your-registry/diagnoseai:latest  # Same image as main app
        command: ["flask", "db", "upgrade"]
        env:
        - name: DATABASE_URL
          value: "postgresql://diagnoseai_user:diagnoseai_pass@postgres-service:5432/diagnoseai"
        envFrom:
        - configMapRef:
            name: diagnoseai-config
        - secretRef:
            name: diagnoseai-secrets